name: Windows build

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore windows/FadeOut.Windows/FadeOut.Windows.csproj
      - name: Build
        run: dotnet build windows/FadeOut.Windows/FadeOut.Windows.csproj -c Release --no-restore
      - name: Publish portable executable
        run: >-
          dotnet publish windows/FadeOut.Windows/FadeOut.Windows.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o dist/windows
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath FadeOut-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FadeOut-Windows-x64
          path: FadeOut-Windows-x64.zip
